name: Spy BouncyCastle

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  spy_dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 👀 Spy BouncyCastle
        id: spy_step
        shell: bash
        run: |
          set -euo pipefail

          REACTOR_POM="${GITHUB_WORKSPACE}/builder/pom.xml"
          FULL_REPORT="${GITHUB_WORKSPACE}/full-dependency-tree.txt"
          BOUNCYCASTLE_REPORT="${GITHUB_WORKSPACE}/bouncycastle-dependency-tree.txt"

          # Declare outputs before artifact upload.
          {
            echo "full_report=${FULL_REPORT}"
            echo "bouncycastle_report=${BOUNCYCASTLE_REPORT}"
          } >> "$GITHUB_OUTPUT"

          # Ensure both artifact files exist even when no matching dependency is found.
          : > "$FULL_REPORT"
          : > "$BOUNCYCASTLE_REPORT"

          # 1. Generate full tree, dropping verbose (buggy) and targeting the full test scope
          echo "Generating dependency tree for the complete Maven reactor (including test/provided)..."
          mvn --batch-mode --no-transfer-progress \
            --file "$REACTOR_POM" \
            org.apache.maven.plugins:maven-dependency-plugin:tree \
            -Dscope=test \
            -DoutputType=text \
            -DoutputFile="$FULL_REPORT" \
            -DappendOutput=true

          # 2. Generate filtered tree using the exact wildcards
          echo "Generating filtered org.bouncycastle dependency tree..."
          mvn --batch-mode --no-transfer-progress \
            --file "$REACTOR_POM" \
            org.apache.maven.plugins:maven-dependency-plugin:tree \
            -Dscope=test \
            -Dincludes="*bouncycastle*" \
            -DoutputType=text \
            -DoutputFile="$BOUNCYCASTLE_REPORT" \
            -DappendOutput=true

          echo "================================================================================"
          # Check for matches. We use a relaxed grep that handles transitives.
          if grep -qi "bouncycastle" "$BOUNCYCASTLE_REPORT"; then
            echo "✅ BouncyCastle dependencies found in the Maven reactor:"
            cat "$BOUNCYCASTLE_REPORT"
          else
            echo "⚠️ No BouncyCastle found in standard tree. Running absolute deep list backup..."
            
            # Backup plan: Ask maven to dump a flat list of EVERY resolved artifact classpath item.
            # This completely bypasses tree rendering and lists raw jar dependencies.
            FLAT_LIST="${GITHUB_WORKSPACE}/flat-list.txt"
            mvn --batch-mode --no-transfer-progress \
              --file "$REACTOR_POM" \
              org.apache.maven.plugins:maven-dependency-plugin:list \
              -DoutputFile="$FLAT_LIST" \
              -DappendOutput=true > /dev/null 2>&1 || true

            if grep -qi "bouncycastle" "$FLAT_LIST" 2>/dev/null; then
              echo "✅ BouncyCastle detected inside deep classpath list scan!"
              grep -i "bouncycastle" "$FLAT_LIST"
              # Overwrite bouncycastle report with the flat list findings so it's archived
              cp "$FLAT_LIST" "$BOUNCYCASTLE_REPORT"
            else
              echo "❌ No resolved org.bouncycastle dependencies were found even in deep classpath."
              echo "Complete dependency tree follows for diagnostics:"
              cat "$FULL_REPORT"
            fi
          fi
          echo "================================================================================"

      - name: 📁 Archive dependency trees
        uses: actions/upload-artifact@v6
        with:
          name: EVS-dependency-tree
          path: |
            ${{ steps.spy_step.outputs.bouncycastle_report }}
            ${{ steps.spy_step.outputs.full_report }}
          if-no-files-found: error
          retention-days: 1
