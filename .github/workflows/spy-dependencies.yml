name: Spy Dependencies

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  spy_dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: ✨ Fix permissions
        run: |
          chmod u+x builder/release.sh    
      - name: 🔨 Build project with Maven
        shell: bash
        run: |
          cd builder && ./release.sh        
      - name: List dependancies 
        run: |
          find . -maxdepth 2 -name "pom.xml" -not -path "*/target/*" | while read -r pom; do
            echo "=================================================="
            echo "Analyzing: $pom"
            echo "=================================================="
            mvn dependency:tree --file "$pom" --batch-mode
          done
