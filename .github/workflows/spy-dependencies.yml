name: Spy Dependencies

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  spy_dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven         
      - name: ✨ List dependancies 
        run: |
          echo "=================================================="
          echo "Analyzing multi-module project via builder/pom.xml"
          echo "=================================================="
          mvn dependency:analyze --file builder/pom.xml --batch-mode
