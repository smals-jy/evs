name: Spy Dependencies

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  spy_dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install dependancies
        run: |
          cd builder   
          mvn clean install -DskipTests          
      - name: List dependancies 
        shell: bash
        run: |
          mvn dependency:tree --file builder/pom.xml
      - name: Find duplicated dependancies
        shell: bash
        run: |  
          mvn dependency:analyze-duplicate --file builder/pom.xml   
