name: Spy BouncyCastle

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  spy_dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 👀 Spy BouncyCastle
        id: spy_step
        shell: bash
        run: |
          set -euo pipefail

          REACTOR_POM="${GITHUB_WORKSPACE}/builder/pom.xml"
          FULL_REPORT="${GITHUB_WORKSPACE}/full-dependency-tree.txt"
          BOUNCYCASTLE_REPORT="${GITHUB_WORKSPACE}/bouncycastle-dependency-tree.txt"

          {
            echo "full_report=${FULL_REPORT}"
            echo "bouncycastle_report=${BOUNCYCASTLE_REPORT}"
          } >> "$GITHUB_OUTPUT"

          # Clear previous files
          : > "$FULL_REPORT"
          : > "$BOUNCYCASTLE_REPORT"

          echo "Generating a highly detailed dependency tree with conflicts..."
          # Running dependency:tree with verbose=true on the full project. 
          # This forces Maven to write omitted, duplicate, and conflicted versions (like 1.64 vs 1.82) to the tree file.
          mvn --batch-mode --no-transfer-progress \
            --file "$REACTOR_POM" \
            org.apache.maven.plugins:maven-dependency-plugin:tree \
            -Dverbose=true \
            -DoutputFile="$FULL_REPORT" \
            -DappendOutput=true

          echo "================================================================================"
          echo "🔍 TRACING THE PATHS RESPONSIBLE FOR BOUNCYCASTLE..."
          echo "================================================================================"

          # Run a custom parser on the generated full report to extract the dependency chain
          # for both BouncyCastle 1.82 and 1.64.
          perl -ne '
            push @stack, $_;
            # Count indent spaces to track hierarchy depth
            $indent = length(($&)) if /^\s*([\|\\+-]+|\s+)/;
            splice(@stack, 0, $#stack) if $indent == 0 && $_ =~ /^\[INFO\]\s+[a-zA-Z0-9]/;
            
            # If line matches bouncycastle, print the path leading up to it
            if (/bouncycastle/i) {
              print "\n🎯 Found BouncyCastle dependency path:\n";
              # Print the saved hierarchy stack
              for $line (@stack) {
                # Only print lines that are less indented than our match
                print $line;
              }
              print "--------------------------------------------------------------------------------\n";
            }
            # Keep stack sized appropriately
            shift @stack while @stack > 30;
          ' "$FULL_REPORT" > "$BOUNCYCASTLE_REPORT"

          # Print the results to the logs
          if [ -s "$BOUNCYCASTLE_REPORT" ]; then
            cat "$BOUNCYCASTLE_REPORT"
          else
            echo "⚠️  Maven's verbose tree was bypassed by a packaging plugin."
            echo "Extracting the absolute classpath from 'dependency:list' instead..."
            mvn --batch-mode --no-transfer-progress \
              --file "$REACTOR_POM" \
              org.apache.maven.plugins:maven-dependency-plugin:list \
              -DoutputFile="$BOUNCYCASTLE_REPORT" \
              -DappendOutput=true
            
            echo "Flat List Output:"
            grep -i "bouncycastle" "$BOUNCYCASTLE_REPORT"
          fi
          echo "================================================================================"

      - name: 📁 Archive dependency trees
        uses: actions/upload-artifact@v6
        with:
          name: EVS-dependency-tree
          path: |
            ${{ steps.spy_step.outputs.bouncycastle_report }}
            ${{ steps.spy_step.outputs.full_report }}
          if-no-files-found: error
          retention-days: 1
