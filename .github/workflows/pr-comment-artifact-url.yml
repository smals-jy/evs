# Credits to https://github.com/orgs/community/discussions/51403#discussioncomment-5515349
name: Comment Artifact URL on PR

on:
  workflow_run:
    types:
      - "completed"
    workflows:
      - "Maven CI/CD"

jobs:
  comment-on-pr:
    if: github.event.workflow_run.conclusion == 'success'
    permissions: 
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: 8BitJonny/gh-get-current-pr@4.0.0
        id: PR
        with:
          # Only return if PR is still open. (By default it returns PRs in any state.)
          filterOutClosed: true
      - name: Get Artifact URL & PR Info
        if: steps.PR.outputs.pr_found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_EVENT_OBJ: ${{ toJSON(github.event.workflow_run) }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          sanitize_env_value() {
            printf '%s' "$1" | tr -d '\r\n'
          }

          PREVIOUS_JOB_ID=$(jq -r '.id' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          PREVIOUS_JOB_ID="$(sanitize_env_value "$PREVIOUS_JOB_ID")"
          [[ "$PREVIOUS_JOB_ID" =~ ^[0-9]+$ ]] || { echo "Invalid PREVIOUS_JOB_ID"; exit 1; }
          echo "Previous Job ID: $PREVIOUS_JOB_ID"
          echo "PREVIOUS_JOB_ID=$PREVIOUS_JOB_ID" >> "$GITHUB_ENV"
          
          SUITE_ID=$(jq -r '.check_suite_id' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          SUITE_ID="$(sanitize_env_value "$SUITE_ID")"
          [[ "$SUITE_ID" =~ ^[0-9]+$ ]] || { echo "Invalid SUITE_ID"; exit 1; }
          echo "Previous Suite ID: $SUITE_ID"
          echo "SUITE_ID=$SUITE_ID" >> "$GITHUB_ENV"
          
          ARTIFACT_ID=$(gh api "/repos/$OWNER/$REPO/actions/artifacts" \
            --jq ".artifacts.[] |
            select(.workflow_run.id==${PREVIOUS_JOB_ID}) |
            select(.expired==false) |
            .id")
          ARTIFACT_ID="$(sanitize_env_value "$ARTIFACT_ID")"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "Invalid ARTIFACT_ID"; exit 1; }
          
          echo "Artifact ID: $ARTIFACT_ID"
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          
          PR_NUMBER=$(jq -r '.pull_requests[0].number' \
            <<< "$WORKFLOW_RUN_EVENT_OBJ")
          PR_NUMBER="$(sanitize_env_value "$PR_NUMBER")"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR_NUMBER"; exit 1; }
          
          echo "Pull request Number: $PR_NUMBER"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          
          HEAD_SHA=$(jq -r '.pull_requests[0].head.sha' \
            <<< "$WORKFLOW_RUN_EVENT_OBJ")
          HEAD_SHA="$(sanitize_env_value "$HEAD_SHA")"
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid HEAD_SHA"; exit 1; }
          
          echo "Head SHA: $HEAD_SHA"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Update Comment
        if: steps.PR.outputs.pr_found == 'true'
        env:
          JOB_PATH: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ env.PREVIOUS_JOB_ID }}"
          ARTIFACT_URL: "${{ github.server_url }}/${{ github.repository }}/suites/${{ env.SUITE_ID }}/artifacts/${{ env.ARTIFACT_ID }}"
          HEAD_SHA: "${{ env.HEAD_SHA }}"
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ env.PR_NUMBER }}
          body: |-
            ![badge]
            
            Build Successful! You can find a link to the downloadable artifact below.
            
            | Name     | Link                    |
            | -------- | ----------------------- |
            | Commit   | ${{ env.HEAD_SHA }}     |
            | Logs     | ${{ env.JOB_PATH }}     |
            | Download | ${{ env.ARTIFACT_URL }} |
            
            [badge]: https://img.shields.io/badge/Build_Success!-0d1117?style=for-the-badge&labelColor=3fb950&logo=data:image/svg%2bxml;base64,
